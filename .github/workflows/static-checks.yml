name: Static checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find . -type f -name '*.sh' -print0)
      - name: Check Python syntax without importing ROS or LeRobot
        run: |
          python - <<'PY'
          from pathlib import Path
          for f in sorted(Path('.').rglob('*.py')):
              compile(f.read_bytes(), str(f), 'exec')
              print('OK', f)
          PY
      - name: Parse YAML configuration files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for f in sorted(list(Path('.').rglob('*.yaml')) + list(Path('.').rglob('*.yml'))):
              with f.open(encoding='utf-8') as handle:
                  yaml.safe_load(handle)
              print('OK', f)
          PY
